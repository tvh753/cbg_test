[pytest]
# ---- 测试发现规则 ----
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---- 通用参数 ----
addopts =
    -v
    -s
    --strict-markers
    --html=reports/report.html
    --self-contained-html

# ---- 标记注册 ----
markers =
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速用例

# ---- 不扫描的目录 ----
norecursedirs = yaml_cases data reports scripts

# ---- 日志 ----
log_cli = true
log_cli_level = INFO